<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoneyMate - Transactions</title>
    <link rel="stylesheet" href="../CSS/Style.css">
</head>
<body>
    <nav class="navbar">
        <h1>MoneyMate</h1>
        <ul>
            <li><a href="index.html">Dashboard</a></li>
            <li><a href="Transaction.html" class="active">Transactions</a></li>
            <li><a href="Goals.html">Goals</a></li>
            <li><a href="Abouts.html">About</a></li>
            <li>
                <div class="nav-auth-buttons" style="display: inline-flex; gap: 8px;">
                    <button id="open-signin-btn" class="secondary-nav-btn">Sign In</button>
                    <button id="open-signup-btn" class="primary-nav-btn">Sign Up</button>
                    <button id="logout-btn" class="primary-nav-btn" style="display: none;">Logout</button>
                </div>
            </li>
        </ul>
    </nav>

    <main class="container">
        <section class="transaction-section">
            <h2>Transactions</h2>
            <div class="form-group">
                <input type="text" id="tx-desc" placeholder="Description">  
                <div class="currency-input-wrapper">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="tx-amount" placeholder="0.00">
                </div>
                <select id="tx-type">
                    <option value="" style="color: gray; margin-left: -4px;" disabled selected>Cash flow</option>
                    <option value="expense" style="color: red;">Expense</option>
                    <option value="income" style="color: green;">Income</option>
                </select>
                
                <!-- Category dropdown menu -->
                <select id="tx-category">
                    <option value="" disabled selected>Category</option>
                    <option value="Food">Food</option>
                    <option value="Salary">Salary</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Bills">Bills</option>
                    <option value="Other">Other</option>
                </select>

                <input type="date" id="tx-date">
                <button id="submit-tx-btn">Add Transaction</button>
            </div>

            <table class="transaction-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="transaction-list">
                    <!-- Dynamic rows populate here -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <script src="../Javascript/Firebase.js"></script>
    <script src="../Javascript/Script.js"></script>
    <script src="../Javascript/Auth.js"></script>
</body>
</html>
